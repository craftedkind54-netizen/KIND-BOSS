name: Build Minecraft plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'minecraft-plugin/**'
      - '.github/workflows/build-minecraft-plugin.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --file minecraft-plugin/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: kind-boss-minecraft-plugin
          path: minecraft-plugin/target/*.jar
          if-no-files-found: error
