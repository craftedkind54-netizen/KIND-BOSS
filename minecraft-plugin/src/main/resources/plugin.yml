name: KindBossBridge
version: 1.2.2
main: com.kindboss.bridge.KindBossBridge
api-version: '1.21'
author: KIND BOSS
commands:
  strike:
    description: Manage KIND SMP strikes
    usage: /strike <add|remove|list> ...
    permission: kindboss.strike
permissions:
  kindboss.strike:
    # Rank checks run through CraftedCore's canManageStrikes API in the executor.
    # Keep the Bukkit permission open so General Staff are not blocked by op status.
    default: true
